name: Error del PBIP
description: Reportar un error reproducible en modelo, DAX, actualización o reporte.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: No incluya secretos, rutas personales ni datos no públicos.
  - type: input
    id: version
    attributes:
      label: Versión del proyecto
      placeholder: v3.0.0 o commit SHA
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Versión de Power BI Desktop
      placeholder: Mes/año y número completo
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      options:
        - Datos o actualización
        - Modelo o relaciones
        - DAX
        - Reporte o visuales
        - CI/CD
        - Documentación
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Indique cohorte, horizonte y filtros sin adjuntar datos sensibles.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado y observado
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia no sensible
      description: Mensajes, capturas anonimizadas o salida de pruebas.
  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: Verifiqué que el issue no contiene secretos ni datos privados.
          required: true
